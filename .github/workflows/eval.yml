name: AI System Evaluation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  run-eval-harness:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Single Entry-Point Evaluation Harness
      run: |
        python main.py --eval

    - name: Upload Eval Report Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: eval-reports
        path: |
          eval_report.json
          eval_report.md

